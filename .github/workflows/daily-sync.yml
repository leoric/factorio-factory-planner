name: Daily upstream sync

on:
  schedule:
    # Runs once daily at 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true  # allows pushing with the GITHUB_TOKEN

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Add upstream remote
        run: |
          UPSTREAM_URL="https://github.com/ClaudeMetz/FactoryPlanner.git"
          if git remote | grep -q "^ClaudeMetz$"; then
            git remote set-url ClaudeMetz "$UPSTREAM_URL"
          else
            git remote add ClaudeMetz "$UPSTREAM_URL"
          fi

      - name: Fetch upstream
        run: git fetch --no-tags --no-recurse-submodules ClaudeMetz master

      - name: Merge upstream/master
        run: |
          # Try a merge. The union merge attribute will automatically resolve modfiles/changelog.txt.
          # If modfiles/info.json conflicts, the merge pauses, and we resolve it in the next step.
          git merge --no-edit --no-ff ClaudeMetz/master || true

      - name: Auto-resolve info.json and bump upstream version +700
        env:
          UPSTREAM_REMOTE: ClaudeMetz
          INFO_PATH: modfiles/info.json
        run: |
          set -euo pipefail

          # Checkout upstream's info.json as the absolute base for the bump
          if git show "$UPSTREAM_REMOTE/master:$INFO_PATH" >/dev/null 2>&1; then
            git checkout "$UPSTREAM_REMOTE/master" -- "$INFO_PATH"
            upstream_version=$(jq -r '.version' "$INFO_PATH")
          else
            echo "No upstream info.json found at $UPSTREAM_REMOTE/master:$INFO_PATH" >&2
            upstream_version=""
          fi

          # Compute bumped version only if upstream_version looks like X.Y.Z
          bumped_version=""
          if [[ -n "$upstream_version" && "$upstream_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            new_patch=$((patch + 700))
            bumped_version="${major}.${minor}.${new_patch}"
          fi

          # Apply bumped version and stage it
          if [[ -n "$bumped_version" && -f "$INFO_PATH" ]]; then
            echo "Setting $INFO_PATH version -> $bumped_version"
            tmpfile=$(mktemp)
            jq --arg v "$bumped_version" '.version = $v' "$INFO_PATH" > "$tmpfile"
            mv "$tmpfile" "$INFO_PATH"
            git add "$INFO_PATH"
          else
            echo "No bumped version could be computed; skipping info.json bump"
          fi

          # Commit the merge (or changes) if there is anything staged
          if git diff --staged --quiet; then
            echo "No changes to commit after auto-resolution"
          else
            git commit -m "chore: merge upstream ClaudeMetz/master — auto-resolve info.json" || true
          fi

      - name: Create tag from info.json and push changes
        env:
          INFO_PATH: modfiles/info.json
        run: |
          set -euo pipefail

          if [[ -f "$INFO_PATH" ]]; then
            version=$(jq -r '.version' "$INFO_PATH")
            if [[ -n "$version" ]]; then
              tag_name="v${version}"
              echo "Tagging with $tag_name"
              # If tag exists remotely, update it (force)
              git tag -f "$tag_name"
              git push origin --follow-tags --no-verify --no-atomic HEAD:refs/heads/main || true
              git push origin --tags --force || true
            else
              echo "No version found in $INFO_PATH; skipping tag"
            fi
          else
            echo "$INFO_PATH not found; skipping tag"
          fi
