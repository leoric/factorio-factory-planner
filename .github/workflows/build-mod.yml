name: Build mod
on:
  push:
    tags: ['v*'] # <-- Triggers the release when you push a version tag
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # pulls in the locale submodule

      - name: Parse info.json
        id: info
        run: |
          MOD_ROOT="modfiles"
          INFO_PATH="$MOD_ROOT/info.json"

          mod_name=$(jq -r '.name' "$INFO_PATH")
          mod_version_raw=$(jq -r '.version' "$INFO_PATH")

          if [ -z "$mod_name" ] || [ "$mod_name" = "null" ] || [ -z "$mod_version_raw" ] || [ "$mod_version_raw" = "null" ]; then
            echo "❌ Error: Failed to parse 'name' or 'version' from $INFO_PATH"
            exit 1
          fi

          mod_version="${mod_name}_${mod_version_raw}"
          echo "mod_root=$MOD_ROOT" >> "$GITHUB_OUTPUT"
          echo "mod_version_raw=$mod_version_raw" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "zip_name=${mod_version}.zip" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches info.json version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          expected_tag="v${{ steps.info.outputs.mod_version_raw }}"

          if [ "$tag_name" != "$expected_tag" ]; then
            echo "❌ Tag '$tag_name' does not match info.json version (expected '$expected_tag')"
            exit 1
          fi
          echo "✅ Tag matches info.json version: $tag_name"

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="v${{ steps.info.outputs.mod_version_raw }}"
            echo "ℹ️ Manual run — using version from info.json: $release_tag"
          else
            release_tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build isolated archive structure
        run: |
          mod_version="${{ steps.info.outputs.mod_version }}"
          mod_root="${{ steps.info.outputs.mod_root }}"

          mkdir -p "build/$mod_version"

          rsync -a \
            --exclude='.git*' \
            --exclude='.DS_Store' \
            --exclude='__MACOSX' \
            --exclude='build' \
            "$mod_root/" "build/$mod_version/"

      - name: Include LICENSE
        run: cp LICENSE.md "build/${{ steps.info.outputs.mod_version }}/LICENSE.md"

      - name: Include locale files
        run: |
          if [ -f locale/LICENSE.md ]; then
            dest="build/${{ steps.info.outputs.mod_version }}/locale"
            mkdir -p "$dest"
            cp locale/LICENSE.md "$dest/LICENSE.md"

            for dir in locale/*/; do
              name=$(basename "$dir")
              if [ -f "$dir/config.cfg" ]; then
                mkdir -p "$dest/$name"
                cp "$dir/config.cfg" "$dest/$name/config.cfg"
              fi
            done
            echo "- locale files included"
          else
            echo "- no locale submodule content found, skipping"
          fi

      - name: Zip mod
        run: |
          zip_name="${{ steps.info.outputs.zip_name }}"
          mod_version="${{ steps.info.outputs.mod_version }}"

          cd build && \
          zip -r "$zip_name" "$mod_version" \
            -x "*.DS_Store" \
            -x "__MACOSX*" \
            -x "*/images/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.zip_name }}
          path: build/${{ steps.info.outputs.zip_name }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.release_tag }}
          files: build/${{ steps.info.outputs.zip_name }}
          generate_release_notes: true